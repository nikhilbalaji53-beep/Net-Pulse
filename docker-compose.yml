version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: netpulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: netpulse
      POSTGRES_PASSWORD: netpulse_password
      POSTGRES_DB: netpulse_db
    ports:
      - "5432:5432"
    volumes:
      - netpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netpulse -d netpulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: netpulse_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://netpulse:netpulse_password@postgres:5432/netpulse_db
      SECRET_KEY: netpulse-production-super-secret-key-9876543210
      ENVIRONMENT: production
      DEFAULT_PING_INTERVAL: 30
      DEFAULT_TIMEOUT: 5
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: netpulse_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  netpulse_pgdata:
